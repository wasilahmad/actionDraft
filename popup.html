<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ActionDraft</title>
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        min-height: 100vh;
        background: #f8fafc;
        color: #0f172a;
      }

      .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .steps-shell {
        position: relative;
        flex: 1;
        min-height: 0;
      }

      .header {
        padding: 16px;
        border-bottom: 1px solid #e2e8f0;
        background: #ffffff;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .descrition { 
        margin: 14px 0 14px;
        font-size: 12px;
        color: rgba(0,0,0,0.5);
      }

      #status {
        margin-left: auto;
        font-size: 13px;
        color: #475569;
        font-weight: 400;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
        background: #ffffff;
        border-top: 1px solid #e2e8f0;
        padding-top: 14px;
      }

      button {
        min-height: 24px;
        border-radius: 5px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        font-size: 12px;
        color: #0f172a;
        font-weight: 500;
        cursor: pointer;
      }

      button:hover {
        background: #f1f5f9;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      #startBtn {
        border-color: #16a34a;
        color: #166534;
        background: #f0fdf4;
      }

      #stopBtn {
        border-color: #ef4444;
        color: #991b1b;
        background: #fef2f2;
      }

      #clearBtn {
        border-color: #f59e0b;
        color: #92400e;
        background: #fef3c7;
      }

      #steps {
        height: 100%;
        overflow: auto;
        padding: 14px 16px 58px;
      }

      .steps-footer {
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        min-width: 252px;
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-size: 10px;
        color: #64748b;
        background: rgba(248, 250, 252, 0.9);
        border: 1px solid #e2e8f0;
        border-radius: 999px;
        padding: 4px 10px;
        pointer-events: auto;
      }

      .steps-footer a {
        color: #64748b;
        pointer-events: auto;
      }

      .steps-footer-logo {
        height: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        color: #0f172a;
      }

      .step {
        position: relative;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        transition: all 0.2s ease;
      }

      /* SortableJS drag states */
      .sortable-ghost {
        opacity: 0.4;
        background: #f1f5f9;
      }

      .sortable-chosen {
        cursor: grabbing;
      }

      .sortable-drag {
        opacity: 1;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .drag-handle {
        position: absolute;
        top: 8px;
        left: 4px;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
        font-size: 14px;
        font-weight: bold;
        cursor: grab;
        user-select: none;
        letter-spacing: -2px;
      }

      .drag-handle:active {
        cursor: grabbing;
      }

      .step:hover .drag-handle {
        color: #475569;
      }

      .delete-step-btn {
        position: absolute;
        top: -10px;
        right: -10px;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid #e5e7eb;
        border-radius: 50px;
        background: #ffffff;
        color: #0f172a;
        font-size: 16px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: auto;
      }

      .delete-step-btn:hover {
        color: #dc2626;
        background: #fef2f2;
        border-color: #dc2626;
        transform: scale(1.1);
      }

      .delete-step-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        transform: none;
      }

      .step-title {
        margin: 0 0 4px;
        font-size: 12px;
        color: #475569;
        font-weight: 600;
        padding-left: 14px;
      }

      .step-desc {
        margin: 0;
        font-size: 13px;
        line-height: 1.4;
      }

      .step img {
        width: 100%;
        margin-top: 10px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
      }

      .step-image-lazy {
        background: linear-gradient(90deg, #e2e8f0 25%, transparent 25%, transparent 50%, #e2e8f0 50%, #e2e8f0 75%, transparent 75%, transparent);
        background-size: 20px 20px;
        animation: shimmer 1.5s infinite;
        min-height: 200px;
      }

      @keyframes shimmer {
        0% { background-position: -20px 0; }
        100% { background-position: calc(100% + 20px) 0; }
      }

      .muted {
        color: #64748b;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="title">ActionDraft <span id="status">Loading session…</span></h1>
        <p class="descrition">Transform your clicks into a professional guide instantly. Just record, refine, and export.</p>

        <section class="controls">
          <button id="startBtn">Start</button>
          <button id="stopBtn">Stop</button>
          <button id="clearBtn" title="Clear all steps and start new session">Clear</button>
          <button id="editGuideBtn">Edit</button>
          <button id="downloadPdfBtn">Export</button>
        </section>
      </header>      

      <div class="steps-shell">
        <main id="steps"></main>
        <div class="steps-footer">           
          <span>© 2026 ActionDraft | <a href="https://wasilahmad.github.io/actionDraftWeb/donation.html" target="_blank" rel="noreferrer">Buy me a coffee</a> | <a href="" target="_blank" rel="noreferrer">Support</a></span>
        </div>
      </div>
    </div>

    <script src="Sortable.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
