<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ActionDraft</title>
    <link rel="icon" type="image/svg+xml" href="dept-icon.svg" />
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        min-height: 100vh;
        background: #f8fafc;
        color: #0f172a;
      }

      .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .steps-shell {
        position: relative;
        flex: 1;
        min-height: 0;
      }

      .header {
        padding: 16px;
        border-bottom: 1px solid #e2e8f0;
        background: #ffffff;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .descrition { 
        margin: 14px 0 0;
        font-size: 12px;
        color: rgba(0,0,0,0.5);
      }

      #status {
        margin-left: auto;
        font-size: 13px;
        color: #475569;
        font-weight: 400;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 14px 16px;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
      }

      button {
        min-height: 38px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #0f172a;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #f1f5f9;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      #startBtn {
        border-color: #16a34a;
        color: #166534;
        background: #f0fdf4;
      }

      #stopBtn {
        border-color: #ef4444;
        color: #991b1b;
        background: #fef2f2;
      }

      #steps {
        height: 100%;
        overflow: auto;
        padding: 14px 16px 58px;
      }

      .steps-footer {
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        min-width: 240px;
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-size: 10px;
        color: #64748b;
        background: rgba(248, 250, 252, 0.9);
        border: 1px solid #e2e8f0;
        border-radius: 999px;
        padding: 4px 10px;
        pointer-events: none;
      }

      .steps-footer-logo {
        height: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        color: #0f172a;
      }

      .step {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }

      .step-title {
        margin: 0 0 4px;
        font-size: 12px;
        color: #475569;
        font-weight: 600;
      }

      .step-desc {
        margin: 0;
        font-size: 13px;
        line-height: 1.4;
      }

      .step img {
        width: 100%;
        margin-top: 10px;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
      }

      .step-image-lazy {
        background: linear-gradient(90deg, #e2e8f0 25%, transparent 25%, transparent 50%, #e2e8f0 50%, #e2e8f0 75%, transparent 75%, transparent);
        background-size: 20px 20px;
        animation: shimmer 1.5s infinite;
        min-height: 200px;
      }

      @keyframes shimmer {
        0% { background-position: -20px 0; }
        100% { background-position: calc(100% + 20px) 0; }
      }

      .muted {
        color: #64748b;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="title">ActionDraft <span id="status">Loading session…</span></h1>
        <p class="descrition">Transform your clicks into a professional guide instantly. Just record, refine, and export.</p>
      </header>

      <section class="controls">
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
        <button id="editGuideBtn">Edit Draft</button>
        <button id="downloadPdfBtn">Export PDF</button>
      </section>

      <div class="steps-shell">
        <main id="steps"></main>
        <div class="steps-footer">          
          <span>© 2026 ActionDraft. Powered By </span>
          <span class="steps-footer-logo">
            <img src="./logo.svg" alt="DEPT" />
          </span>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
