<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Captured Guide | ActionDraft</title>
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <style>
      :root { color-scheme: light; }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        color: #1f2937;
        background: #ffffff;
        max-width: 980px;
        margin: 0 auto;
        padding: 24px;
      }
      .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
      .step { margin-bottom: 24px; page-break-inside: avoid; }
      .step h2 { margin: 0 0 8px; }
      .step p { margin: 0 0 8px; line-height: 1.4; }
      .step img { width: 100%; max-width: 980px; border: 1px solid #ddd; border-radius: 6px; }
      .image-container { position: relative; display: inline-block; width: 100%; }
      .change-image-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 8px 16px;
        background: rgba(37, 99, 235, 0.95);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        opacity: 0;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        z-index: 5;
      }
      .change-image-btn:hover {
        background: rgba(37, 99, 235, 1);
        transform: scale(1.05);
      }
      .step.editing .image-container:hover .change-image-btn {
        opacity: 1;
      }
      .change-image-btn:disabled {
        background: rgba(107, 114, 128, 0.8);
        cursor: not-allowed;
        transform: none;
      }
      .image-file-input {
        display: none;
      }
      .toolbar { position: sticky; top: 0; display: flex; align-items: center; justify-content: center; gap: 8px; background: #ffffff; padding: 10px 0; z-index: 10;}
      .toolbar button { padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 999px; background: #ffffff; color: #111827; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08); }
      .toolbar button:hover { background: #f8fafc; }
      .toolbar button:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.25); outline-offset: 2px; }
      .toolbar button:disabled { cursor: not-allowed; opacity: 0.6; background: #f8fafc; box-shadow: none; }
      .copy-status { min-width: 84px; font-size: 13px; font-weight: 600; color: #2563eb; text-align: right; }
      .editable[contenteditable="true"] { outline: 2px dashed #22c55e; border-radius: 6px; background: rgba(34, 197, 94, 0.06); padding: 4px 6px; }
      .step-description { min-height: 24px; }

      .step img {
        background: linear-gradient(90deg, #e2e8f0 25%, transparent 25%, transparent 50%, #e2e8f0 50%, #e2e8f0 75%, transparent 75%, transparent);
        background-size: 20px 20px;
        animation: shimmer 1.5s infinite;
      }

      img[loading="lazy"] {
        min-height: 240px;
      }

      @keyframes shimmer {
        0% { background-position: -20px 0; }
        100% { background-position: calc(100% + 20px) 0; }
      }

      @media print {
        .toolbar { display: none !important; }
        .change-image-btn { display: none !important; }
        body { margin: 16px; }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <span id="copyStatus" class="copy-status" aria-live="polite"></span>
      <button id="copyBtn" type="button" disabled>Copy</button>
      <button id="downloadHtmlBtn" type="button" disabled>Download HTML</button>
      <button id="downloadConfluenceBtn" type="button" disabled>Confluence Package</button>
      <button id="editToggle" type="button">Edit</button>
    </div>
    <div class="page-header">
      <h1 class="editable" data-editable="true">User Guide: [Task Name]</h1>      
    </div>

    <main id="guideSteps"></main>

    <script src="jszip.min.js"></script>
    <script src="guide-viewer.js"></script>
  </body>
</html>
